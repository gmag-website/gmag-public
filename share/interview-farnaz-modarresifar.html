<meta property="og:title" content="سنتور در کانون آوانگاردیسم: گفتگو با فرناز مدرسی‌فر">
<meta property="og:description" content="فرناز مدرسی‌فر نخستین آهنگساز ایرانی است که به عنوان پانسیونرِ ویلای مدیچی (Villa Medici)، آکادمی فرانسه در رم، انتخاب شده است، و سنتور، به مثابۀ بخشی جدایی‌ناپذیر از هویت موسیقایی‌اش، همواره همراه اوست. نخستین کنسرتش در ویلا، در ماه نوامبر سال گذشته، با اجرای آثار موسیقی کلاسیک ایرانی برگزار شد. حاصل بیش از شانزده سال پژوهش او دربارۀ این ساز، کتابی است که سال آینده در فرانسه منتشر می‌شود. با او گفت‌وگویی داشتم در سه محور، تا از رویکرد نوآورانه‌اش در آهنگسازی معاصر، چالش‌های پیوند میان سنت و مدرنیته، و نگاهش به نقش اجتماعی موسیقی بپرسم.">
