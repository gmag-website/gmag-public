<script>
/* Clean addresses (EIC, 9 Oct 2026: «why does the link still have # in it?»). The site routes on the
   PATH (/issue/1, /article/<slug>); an old #/… link is rewritten in place so nothing shared breaks.
   Internal links are caught here and moved with the History API; every router listener still hears
   a 'hashchange' event, so the pages need no other wiring. */
(function () {
  var h = location.hash;
  if (h.indexOf('#/') === 0) history.replaceState(null, '', (h.slice(1) || '/') + location.search);
  else if (/\/index\.html$/.test(location.pathname)) history.replaceState(null, '', '/' + location.search + location.hash);
  window.gosanPath = function () { return location.pathname.replace(/\/+$/, '') || '/'; };
  function fire() { window.dispatchEvent(new Event('hashchange')); }
  window.gosanGo = function (to) {
    if (to.indexOf('#/') === 0) to = to.slice(1);
    if (to.charAt(0) !== '/') to = '/' + to;
    if (to !== location.pathname + location.search) { history.pushState(null, '', to); fire(); }
  };
  window.addEventListener('popstate', fire);
  /* an old #/… link followed inside the page: move it to its path before the router hears it */
  window.addEventListener('hashchange', function () {
    var h = location.hash;
    if (h.indexOf('#/') === 0) history.replaceState(null, '', (h.slice(1) || '/') + location.search);
  });
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
    var href = a.getAttribute('href');
    if (href.charAt(0) === '#' && href.charAt(1) !== '/') {
      /* an in-page jump (#sec-…, #fn…): <base href="/"> would send it to the home page, so scroll here */
      var el = href.length > 1 && document.getElementById(decodeURIComponent(href.slice(1)));
      e.preventDefault();
      if (el) {
        history.replaceState(null, '', location.pathname + location.search + href);
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      return;
    }
    if (href.indexOf('#/') === 0) href = href.slice(1);
    if (href.charAt(0) !== '/' || href.charAt(1) === '/') return;
    if (/\.[a-z0-9]+$/i.test(href.split(/[?#]/)[0])) return;     /* a file, not a page */
    e.preventDefault();
    window.gosanGo(href);
  });
})();
</script>
<script>
/* Visits and reading, counted without cookies (EIC, 9 Oct 2026). One small beacon per page view and
   one when the reader leaves it (time on page, how far they read), plus the moments that matter: a
   page turned in the flipbook, a PDF, a share, a subscription, a link out. No IP address and no
   identifier are kept on the reader's device; Do-Not-Track and Global Privacy Control are honoured.
   Collector: tools/analytics-worker/. Counts only on the live domain, never in the preview or desk. */
(function () {
  var END = 'https://gosan-analytics.gosan.workers.dev/e';
  if (!/(^|\.)gosan\.org$/.test(location.hostname) || window.top !== window.self) return;
  if (navigator.doNotTrack === '1' || navigator.globalPrivacyControl) return;
  function send(o) {
    var b = JSON.stringify(o);
    try { if (navigator.sendBeacon && navigator.sendBeacon(END, b)) return; } catch (e) {}
    try { fetch(END, { method: 'POST', body: b, keepalive: true, mode: 'no-cors' }); } catch (e) {}
  }
  var id, path, shown, seen, depth, ended;
  /* the social post that brought the reader: ?via=ig-music, or utm_source / utm_campaign; landing view only */
  var qs = new URLSearchParams(location.search);
  var via = qs.get('via') || (qs.get('utm_source') ? qs.get('utm_source') + (qs.get('utm_campaign') ? '-' + qs.get('utm_campaign') : '') : '')
    || (qs.get('fbclid') ? 'facebook' : '');
  function scrollDepth() {
    var h = document.documentElement.scrollHeight - innerHeight;
    var d = h > 0 ? Math.round(100 * scrollY / h) : 100;
    if (d > depth) depth = Math.min(100, d);
  }
  function leave() {
    if (!id || ended) return;
    if (shown) { seen += Date.now() - shown; shown = 0; }
    ended = true;
    send({ t: 'leave', id: id, s: Math.round(seen / 1000), dp: depth });
  }
  function view() {
    var p = window.gosanPath ? window.gosanPath() : location.pathname;
    if (p === path && id) return;
    leave();
    path = p; id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    seen = 0; depth = 0; ended = false; shown = document.hidden ? 0 : Date.now();
    send({ t: 'view', id: id, p: p, r: document.referrer, l: navigator.language || '', v: via });
    via = '';
    setTimeout(scrollDepth, 1500);
  }
  window.gosanTrack = function (n, d) { if (id) send({ t: 'event', id: id, p: path, n: n, d: d || '' }); };
  addEventListener('scroll', scrollDepth, { passive: true });
  addEventListener('hashchange', function () { setTimeout(view, 0); });
  addEventListener('pagehide', leave);
  addEventListener('gosan:search', function () { window.gosanTrack('search', path); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { leave(); }
    else if (id && ended) { ended = false; shown = Date.now(); }       /* back to the tab: keep counting */
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : null; if (!t) return;
    if (t.closest('.flip-btn, .flip-half, .flip-one')) return window.gosanTrack('flip', path);
    var s = t.closest('.share-icons a');
    if (s) return window.gosanTrack(/PDF/.test(s.title) ? 'pdf' : 'share', s.title || s.getAttribute('aria-label'));
    var a = t.closest('a[href]'); if (!a) return;
    var href = a.href || '';
    /* which part of the page sends readers on: homepage strip, featured rail, menu, series nav… */
    var to = a.getAttribute('href') || '';
    if (/^\/(article|issue|about|archive|support)/.test(to)) {
      var sec = t.closest('[data-screen-label], header, nav, footer, .series-nav, .nc-feat');
      var from = !sec ? 'page' : sec.getAttribute('data-screen-label') || (sec.className && String(sec.className).split(' ')[0]) || sec.tagName.toLowerCase();
      return window.gosanTrack('nav', from + ' → ' + to.replace(/\/$/, ''));
    }
    if (/\.pdf($|[?#])/i.test(href)) return window.gosanTrack('pdf', href.replace(/^.*\//, ''));
    if (/^https?:/.test(href) && !/^https?:\/\/([^\/]*\.)?gosan\.org/.test(href)) window.gosanTrack('outbound', a.hostname);
  }, true);
  view();
})();
</script>
